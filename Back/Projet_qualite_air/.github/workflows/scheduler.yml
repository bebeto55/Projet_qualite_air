name: Run Retrieval Script Periodically

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes.
  workflow_dispatch: # Allows you to run it manually from the GitHub UI for testing

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run script
        env:
          SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }} # Optional: for secure API keys
        run: python app_streaming.py